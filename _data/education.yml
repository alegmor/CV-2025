- uni: "University of British Columbia Okanagan (UBCO)"
  degree: "PhD in Mechanical Engineering"
  year: "2023–Present"
  award: "Supervisor: Dr. Joshua Brinkerhoff"
  summary: >
    <strong>Research project:</strong> Modelling Heterogeneous Phase Change in Cryogenic Fluids.
    <ul>
      <li>Developed 1D and 2D solvers to study the Semi-Lagrangian Lattice Boltzmann Method with Particles on Demand (SLLBM-PonD).</li>
      <li>Running simulations using a C++ code developed by Dr. Kasper Petersen to model the spinodal decomposition of a van der Waals fluid.</li>
