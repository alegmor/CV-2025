# Resume settings
resume_name: J. Alejandra García M.
resume_title: PhD Student in Mechanical Engineering
resume_contact_email: janette.morales@ubc.ca
resume_contact_telephone: 236-970-9007
resume_contact_address: UBCO | School of Engineering | Kelowna, BC
resume_looking_for_work: yes
resume_avatar: false
resume_header_intro: >
resume_header_intro: >
  I am an enthusiastic user and supporter of open-source software with a strong foundation in numerical methods,
   particularly the lattice Boltzmann method (LBM) and computational fluid dynamics (CFD). I am passionate about applying 
   computational modelling to projects that support the integration of renewable energy sources and the decarbonization
    of industrial sectors. I am driven by a desire to push the boundaries of science while actively seeking opportunities 
    to broaden the breadth of my expertise through applied, interdisciplinary research. I am highly motivated to learn, collaborate, 
    and contribute to innovative solutions that foster a more sustainable future.
display_header_contact_info: true


